databases:
  - name: nexora-db
    databaseName: nexora
    user: nexora

services:
  - type: web
    name: nexora-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.node
    dockerContext: .
    healthCheckPath: /api/v1/health/live
    preDeployCommand: ./node_modules/.bin/prisma migrate deploy --config prisma.config.ts && node dist/seed.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/

  - type: web
    name: nexora-web
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.web
    dockerContext: .
    envVars:
      - key: API_PROXY_URL
        sync: false
