name: nexora

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://nexora:${POSTGRES_PASSWORD:-nexora}@postgres:5432/nexora
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-nexora}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-nexora-secret}

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora}
      POSTGRES_DB: nexora
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexora -d nexora']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: ['server', '-s3', '-dir=/data']
    ports:
      - '8333:8333'
    volumes:
      - seaweedfs-data:/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args:
        APP: api
    profiles: ['app']
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args:
        APP: worker
    profiles: ['app']
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    profiles: ['app']
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    profiles: ['app']
    ports:
      - '80:80'
      - '443:443'
    environment:
      NEXORA_DOMAIN: ${NEXORA_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  caddy-data:
