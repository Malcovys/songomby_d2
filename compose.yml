name: nexora

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://nexora:${POSTGRES_PASSWORD:-nexora}@postgres:5432/nexora

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora}
      POSTGRES_DB: nexora
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexora -d nexora']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args:
        APP: api
    profiles: ['app']
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    profiles: ['app']
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    profiles: ['app']
    ports:
      - '80:80'
      - '443:443'
    environment:
      NEXORA_DOMAIN: ${NEXORA_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web

volumes:
  postgres-data:
  caddy-data:
