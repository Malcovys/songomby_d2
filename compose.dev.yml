name: nexora-dev

x-dev-image: &dev-image
  build:
    context: .
    dockerfile: docker/Dockerfile.dev
  working_dir: /repo

x-dev-volumes: &dev-volumes
  - .:/repo
  - pnpm-store:/pnpm/store
  - node-modules-root:/repo/node_modules
  - node-modules-api:/repo/apps/api/node_modules
  - node-modules-web:/repo/apps/web/node_modules
  - node-modules-core:/repo/packages/core/node_modules
  - node-modules-contracts:/repo/packages/contracts/node_modules

x-dev-env: &dev-env
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DATABASE_URL: postgresql://nexora:${POSTGRES_PASSWORD:-nexora}@postgres:5432/nexora
  API_PROXY_TARGET: http://api:3000

services:
  postgres:
    extends:
      file: compose.yml
      service: postgres
    ports:
      - '${POSTGRES_PORT:-5432}:5432'

  install:
    <<: *dev-image
    command: sh -c "pnpm install --frozen-lockfile && pnpm turbo run build --filter=@nexora/api..."
    volumes: *dev-volumes
    environment: *dev-env

  api:
    <<: *dev-image
    command: sh -c "pnpm --filter @nexora/api exec tsc -p tsconfig.json --watch --preserveWatchOutput & exec node --watch --watch-preserve-output --watch-path=apps/api/dist --watch-path=packages/core/dist --watch-path=packages/contracts/dist apps/api/dist/main.js"
    volumes: *dev-volumes
    environment: *dev-env
    ports:
      - '3000:3000'
    depends_on: &dev-depends
      install:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  core:
    <<: *dev-image
    command: pnpm --filter @nexora/core dev
    volumes: *dev-volumes
    environment: *dev-env
    depends_on:
      install:
        condition: service_completed_successfully

  contracts:
    <<: *dev-image
    command: pnpm --filter @nexora/contracts dev
    volumes: *dev-volumes
    environment: *dev-env
    depends_on:
      install:
        condition: service_completed_successfully

  web:
    <<: *dev-image
    command: pnpm --filter @nexora/web dev --host 0.0.0.0
    volumes: *dev-volumes
    environment: *dev-env
    ports:
      - '5173:5173'
    depends_on:
      install:
        condition: service_completed_successfully

volumes:
  pnpm-store:
  node-modules-root:
  node-modules-api:
  node-modules-web:
  node-modules-core:
  node-modules-contracts:
  postgres-data:
